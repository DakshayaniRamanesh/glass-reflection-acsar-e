investigation_findings:
  degeneracy_caveat: The test corridor environment lacks orthogonal reference planes
    along the hallway heading. While vertical and cross-track alignment are constrained,
    along-track translation remains weakly observable. Target-based calibration with
    multi-planar corner reflectors is required.
  double_applied_yaw_bug: 'The Hesai driver already applied +90 deg yaw rotation (transform_flag:
    true). Earlier calibration scripts mistakenly assumed Hesai was still unrotated
    and applied another -90 deg yaw, forcing cross-track features to match along-track
    features.'
  inlier_ratio_explanation: The 7.7% inlier count in earlier reports was caused by
    comparing a 360-degree surround Hesai cloud (56,700 points) against a single non-repetitive
    L1 sub-scan packet containing only 503 points.
